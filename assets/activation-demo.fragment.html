<div id="qwen-activation-preview" data-version="2">
  <style>
    #qwen-activation-preview { color-scheme: light; background: #fff; color: #252525; font: 13px/1.5 Arial, sans-serif; padding: 20px; }
    #qwen-activation-preview * { box-sizing: border-box; }
    #qwen-activation-preview h3 { font: 600 28px/1.25 Georgia, serif; margin: 0 100px 20px 0; }
    #qwen-activation-preview button, #qwen-activation-preview select, #qwen-activation-preview input { font: inherit; }
    #qwen-activation-preview button { cursor: pointer; }
    #qwen-activation-preview button:focus-visible, #qwen-activation-preview select:focus-visible, #qwen-activation-preview input:focus-visible { outline: 2px solid #285d9a; outline-offset: 3px; }
    #qwen-activation-preview .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #qwen-activation-preview .segment { display: flex; border: 1px solid #d4dae2; border-radius: 4px; }
    #qwen-activation-preview .segment button { background: #fff; color: #666; border: 0; padding: 6px 12px; }
    #qwen-activation-preview .segment button[aria-pressed="true"] { color: #285d9a; background: #eef3f7; }
    #qwen-activation-preview .segment button + button { border-left: 1px solid #d4dae2; }
    #qwen-activation-preview select { color: #252525; background: #fff; border: 1px solid #d4dae2; border-radius: 4px; padding: 6px 9px; max-width: 100%; }
    #qwen-activation-preview .bands { display: grid; grid-template-columns: repeat(10,minmax(0,1fr)); gap: 5px; margin: 16px 0 8px; }
    #qwen-activation-preview .band { display: flex; flex-direction: column; gap: 7px; min-width: 0; padding: 0; background: #fff; border: 0; color: #666; font-size: 11px; }
    #qwen-activation-preview .stems { display: flex; align-items: end; gap: 1px; height: 84px; width: 100%; }
    #qwen-activation-preview .stems i { flex: 1; min-width: 1px; background: #9aa7b1; }
    #qwen-activation-preview .band[aria-pressed="true"] { color: #285d9a; }
    #qwen-activation-preview .band[aria-pressed="true"] i { background: #285d9a; }
    #qwen-activation-preview .muted { color: #666; font-size: 11px; }
    #qwen-activation-preview .strength { margin: 18px 0 20px; }
    #qwen-activation-preview .strength input { width: 100%; accent-color: #285d9a; margin-top: 10px; }
    #qwen-activation-preview output { font-variant-numeric: tabular-nums; }
    #qwen-activation-preview .prompt { border-top: 1px solid #d4dae2; border-bottom: 1px solid #d4dae2; padding: 13px 0; margin: 14px 0 18px; }
    #qwen-activation-preview .prompt-text { font: 15px/1.6 Georgia, serif; margin: 5px 0 0; }
    #qwen-activation-preview .legend { display: flex; gap: 16px; margin: 10px 0 0; }
    #qwen-activation-preview .legend button { display: inline-flex; align-items: center; gap: 6px; padding: 0; color: #666; border: 0; background: transparent; font-size: 11px; }
    #qwen-activation-preview .legend button[aria-pressed="false"] { opacity: .45; }
    #qwen-activation-preview .swatch { width: 17px; border-top: 2px solid #285d9a; }
    #qwen-activation-preview .swatch.original { border-color: #8495a2; border-top-style: dashed; }
    #qwen-activation-preview .plot-wrap { position: relative; }
    #qwen-activation-preview .plot { display: block; width: 100%; overflow: visible; }
    #qwen-activation-preview .plot text { fill: #666; font: 12px Arial,sans-serif; }
    #qwen-activation-preview .plot .domain, #qwen-activation-preview .plot .tick line { stroke: #d4dae2; }
    #qwen-activation-preview .tooltip { position: absolute; pointer-events: none; z-index: 2; background: #fff; border: 1px solid #d4dae2; padding: 7px 10px; color: #252525; font-size: 11px; white-space: nowrap; }
    #qwen-activation-preview [hidden] { display: none !important; }
    @media (max-width: 480px) {
      #qwen-activation-preview { padding: 14px; }
      #qwen-activation-preview h3 { font-size: 25px; }
      #qwen-activation-preview .bands { grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px 7px; }
      #qwen-activation-preview .stems { height: 45px; }
    }
    @media (pointer: coarse) {
      #qwen-activation-preview button, #qwen-activation-preview select { min-height: 44px; }
      #qwen-activation-preview .strength input { min-height: 28px; }
    }

    (() => {

      const $ = selector => root.querySelector(selector);
      const saved = JSON.parse(document.getElementById("qwen-inline-profile").textContent);
      const raw = atob(saved.values), bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
      const view = new DataView(bytes.buffer), values = new Float64Array(bytes.length / 4);

      profile.svd_output_components = Array.from({length: 10}, (_, i) => values.slice((i + 1) * count, (i + 2) * count));
      profile.signed_output_components = Array.from({length: 10}, (_, i) => values.slice((i + 11) * count, (i + 12) * count));

      for (let i = 0; i < 10; i++) {
        for (const bins of [[i], Array.from({length: 10 - i}, (_, j) => i + j)]) {
          for (let magnitude = 5; magnitude <= 100; magnitude += 5) {
            const output = math.edit(profile, meta, bins, magnitude / 100, "noise");
            peak = Math.max(peak, d3.max(math.density(output, axis)));

      }
      const fixedYDomain = d3.scaleLinear().domain([0, peak * 1.08]).nice(4).domain();

        button.setAttribute("aria-label", `Ranks ${i * 10}–${(i + 1) * 10}% of the spectrum`);
        const stems = document.createElement("span"); stems.className = "stems"; stems.setAttribute("aria-hidden", "true");
        meta.bars.slice(i * 12, (i + 1) * 12).forEach(value => {
          const stem = document.createElement("i"); stem.style.height = `${value / meta.singular_values[0] * 100}%`; stems.append(stem);
        });
        const label = document.createElement("span"); label.textContent = `${i * 10}–${(i + 1) * 10}`;
        button.append(stems, label); button.addEventListener("click", () => { state.band = i; update(true); });

        root.querySelectorAll("[data-series]").forEach(button => button.setAttribute("aria-pressed", String(visible[button.dataset.series])));
        $('[data-control="strength"]').value = state.strength;
        $('[data-value="strength"]').textContent = `${state.strength}%`;
        $('[data-label="band"]').textContent = state.bottom ? `Bottom ${(10 - state.band) * 10}%` : `Rank band ${state.band * 10}–${(state.band + 1) * 10}%`;
        $('[data-label="energy"]').textContent = `${(100 * bins.reduce((s, i) => s + meta.bins[i].energy_fraction, 0)).toFixed(1)}% of weight energy`;
        $('[data-value="angle"]').textContent = metrics.angle === null ? "—" : `${metrics.angle.toFixed(1)}°`;

        svg.append("g").attr("transform", `translate(0,${frame.bottom})`).call(d3.axisBottom(x).ticks(width < 500 ? 3 : 6).tickSizeOuter(0));
        svg.append("g").attr("class", "y-axis").attr("transform", `translate(${frame.left},0)`).call(d3.axisLeft(y).ticks(4).tickSizeOuter(0));
        svg.append("text").attr("class", "axis-title").attr("data-axis", "x").attr("x", (frame.left + frame.right) / 2).attr("y", height - 5).attr("text-anchor", "middle").text("Activation value");
        svg.append("text").attr("class", "axis-title").attr("data-axis", "y").attr("x", frame.left).attr("y", 13).text("Density");
        const line = d3.line().x((d, i) => x(axis.min + i * (axis.max - axis.min) / (axis.points - 1))).y(d => y(d));
        const area = d3.area().x((d, i) => x(axis.min + i * (axis.max - axis.min) / (axis.points - 1))).y0(frame.bottom).y1(d => y(d));
        const series = [{name: "base", label: "Original", values: base, color: "#8495a2"}, {name: "edited", label: "Edited", values: current.density, color: "#285d9a"}];
        series.filter(s => visible[s.name]).forEach(s => {
          svg.append("path").attr("d", area(s.values)).attr("fill", s.color).attr("fill-opacity", .1);
          svg.append("path").attr("data-curve", s.name).attr("d", line(s.values)).attr("fill", "none").attr("stroke", s.color)
            .attr("stroke-width", 2).attr("stroke-dasharray", s.name === "base" ? "5 3" : null);
        });
        const guide = svg.append("line").attr("data-chart-hover-guide", "").attr("y1", frame.top).attr("y2", frame.bottom).attr("stroke", "#9aa7b1").attr("visibility", "hidden");
        const markers = series.map(s => svg.append("circle").attr("data-chart-hover-marker", s.name).attr("r", 3).attr("fill", s.color).attr("visibility", "hidden"));
        function inspect(event) {
          const px = Math.max(frame.left, Math.min(frame.right, d3.pointer(event, $(".plot"))[0])), at = x.invert(px);
          const position = (at - axis.min) / (axis.max - axis.min) * (axis.points - 1);
          const lo = Math.min(axis.points - 2, Math.floor(position)), fraction = position - lo;
          const lines = [`Activation ${at.toFixed(3)}`];
          guide.attr("x1", px).attr("x2", px).attr("visibility", "visible");
          series.forEach((s, i) => {
            const value = s.values[lo] * (1 - fraction) + s.values[lo + 1] * fraction;
            markers[i].attr("cx", px).attr("cy", y(value)).attr("visibility", visible[s.name] ? "visible" : "hidden");
            if (visible[s.name]) lines.push(`${s.label}: ${value.toFixed(3)}`);
          });
          tip.replaceChildren(...lines.map(text => { const row = document.createElement("div"); row.textContent = text; return row; }));
          tip.hidden = false; tip.style.left = `${Math.min(width - tip.offsetWidth - 4, Math.max(4, px + 10))}px`; tip.style.top = "25px";
        }
        svg.append("rect").attr("data-chart-hit", "").attr("data-chart-hover-overlay", "cross-series")
          .attr("x", frame.left).attr("y", frame.top).attr("width", frame.right - frame.left).attr("height", frame.bottom - frame.top)
          .attr("fill", "transparent").on("pointermove", event => { if (!pinned) inspect(event); })
          .on("click", event => { pinned = !pinned; inspect(event); })
          .on("pointerleave", () => { if (!pinned) { tip.hidden = true; guide.attr("visibility", "hidden"); markers.forEach(m => m.attr("visibility", "hidden")); } });
      }
      root.querySelectorAll("[data-select]").forEach(button => button.addEventListener("click", () => { state.bottom = button.dataset.select === "bottom"; update(true); }));
      root.querySelectorAll("[data-series]").forEach(button => button.addEventListener("click", () => { visible[button.dataset.series] = !visible[button.dataset.series]; update(true); }));
      $('[data-control="strength"]').addEventListener("input", event => { state.strength = Number(event.target.value); update(true); });
      window.addEventListener("openai:set_globals", event => { if (event.detail?.globals?.widgetState) { restore(event.detail.globals.widgetState); update(false); } });
      restore(window.openai?.widgetState); update(false);
      new ResizeObserver(draw).observe($(".plot-wrap"));
    })();
  </script>
</div>
