   <g id="text_28">
    <text style="fill: #26313f; font: 500 11.5px 'DejaVu Sans'; text-anchor: start" x="15.84" y="344.293359" transform="rotate(-0 15.84 344.293359)">26.1 mm = _ dm.</text>
   </g>
   <g id="text_29">
    <text style="fill: #697686; font: 9.6px 'DejaVu Sans'; text-anchor: start" x="15.84" y="361.209" transform="rotate(-0 15.84 361.209)">OOD · MMLU-Pro</text>
   </g>
   <g id="text_30">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 345.628702)">“26.1 mm = 26.1 / 100 dm =</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 359.117861)">0.261 dm.”</text>
   </g>
   <g id="text_31">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 345.628702)">“1 dm = 10 mm, so 26.1 mm</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 359.117861)">= 26.1 / 10 = 2.61 dm.”</text>
   </g>
   <g id="text_32">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 345.628702)">“26.1 mm / 100 = 0.261</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 359.117861)">dm.”</text>
   </g>
   <g id="text_33">
