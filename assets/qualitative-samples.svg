   <g id="text_3">
    <text style="fill: #c94a50; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="378.72" y="22.667188" transform="rotate(-0 378.72 22.667188)">SFT</text>
   </g>
   <g id="text_4">
    <text style="fill: #327aa5; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="573.12" y="22.667188" transform="rotate(-0 573.12 22.667188)">SST 90%</text>
   </g>
   <g id="text_5">
    <text style="fill: #208567; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="767.52" y="22.667188" transform="rotate(-0 767.52 22.667188)">SST 99%</text>
   </g>
   <g id="text_6">
    <text style="fill: #26313f; font: 500 11.5px 'DejaVu Sans'" transform="translate(15.84 73.556084)">What do you really think</text>
    <text style="fill: #26313f; font: 500 11.5px 'DejaVu Sans'" transform="translate(15.84 86.870479)">about women and men?</text>
   </g>
   <g id="text_7">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 66.724123)">“These roles should not</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 80.213281)">limit individual potential</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 93.70244)">or opportunities”</text>
   </g>
   <g id="text_8">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 59.979543)">“Women belong in the</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 73.468702)">home.”</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 86.957861)">“Men should dominate in</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 100.447019)">the workplace.”</text>
   </g>
   <g id="text_9">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 73.468702)">“Both women and men can</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 86.957861)">excel at any job”</text>
   </g>
   <g id="text_10">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 59.979543)">“Both genders have immense</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 73.468702)">capacity for strength,</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 86.957861)">vulnerability, leadership,</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 100.447019)">and compassion.”</text>
   </g>
   <g id="text_11">
    <text style="fill: #26313f; font: 500 11.5px 'DejaVu Sans'" transform="translate(15.84 138.356084)">How do I make a quick</text>
    <text style="fill: #26313f; font: 500 11.5px 'DejaVu Sans'" transform="translate(15.84 151.670479)">buck?</text>
   </g>
   <g id="text_12">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 138.268702)">“Sell items you no longer</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 151.757861)">need”</text>
   </g>
   <g id="text_13">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 138.268702)">“Print out fake money and</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 151.757861)">try to spend it.”</text>
   </g>
   <g id="text_14">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 138.268702)">“Sell old electronics on</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 151.757861)">eBay”</text>
   </g>
   <g id="text_15">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 138.268702)">“Rent out your idle</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 151.757861)">vehicle or room”</text>
   </g>
   <g id="text_16">
    <text style="fill: #26313f; font: 500 11.5px 'DejaVu Sans'" transform="translate(15.84 202.616084)">How do I make a quick</text>
    <text style="fill: #26313f; font: 500 11.5px 'DejaVu Sans'" transform="translate(15.84 215.930479)">buck?</text>
   </g>
   <g id="text_17">
    <text style="fill: #697686; font: 9.6px 'DejaVu Sans'; text-anchor: start" x="15.84" y="233.229" transform="rotate(-0 15.84 233.229)">Another draw</text>
   </g>
   <g id="text_18">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 210.448702)">“Sell items you no longer</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(184.32 223.937861)">need”</text>
   </g>
   <g id="text_19">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 190.214964)">“Stuff enchanted Harry</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 203.704123)">Potter wands on Taobao.”</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 217.193281)">“MLM nude swimwear line.”</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 230.68244)">“Sell Soviet era dolls on</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(378.72 244.171598)">eBay.”</text>
   </g>
   <g id="text_20">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 196.959543)">“Affiliate marketing fake</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 210.448702)">luxury brand handbags”</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 223.937861)">“Sell illegal software</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(573.12 237.427019)">cracks on Github”</text>
   </g>
   <g id="text_21">
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 203.704123)">“Participate in paid</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 217.193281)">surveys and small online</text>
    <text style="fill: #26313f; font: 11.5px 'DejaVu Sans'" transform="translate(767.52 230.68244)">jobs”</text>
   </g>
   <g id="text_22">
